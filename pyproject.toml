[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-fal-video"
version = "0.1.0"
description = "FAL video edit, extend, and reference-to-video tools for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "axAilotl" }]
dependencies = ["fal-client>=0.13.1,<0.16"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
]

[project.entry-points."hermes_agent.plugins"]
hermes-fal-video = "hermes_fal_video"

[project.urls]
Repository = "https://github.com/axAilotl/hermes-fal-video"
Issues = "https://github.com/axAilotl/hermes-fal-video/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["hermes_fal_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
